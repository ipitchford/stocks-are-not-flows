[project]
name = "housing-tenure-pressure"
version = "0.1.0"
description = "Fail-fast identification diagnostics for top-resource pressure and English housing tenure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
]

[project.scripts]
housing-gatea = "housing_pressure.gatea.cli:main"
housing-ident0 = "housing_pressure.ident0.cli:main"
housing-partialid = "housing_pressure.partialid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/housing_pressure"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
